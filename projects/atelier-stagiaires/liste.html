<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Liste des stagiaires</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 800px; margin: 40px auto; padding: 0 16px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 16px; }
    .card { border: 1px solid #ddd; border-radius: 10px; padding: 12px; text-align: center; }
    .card img { width: 100%; height: 160px; object-fit: cover; border-radius: 8px; }
  </style>
</head>
<body>
  <h1>Stagiaires</h1>
  <p><a href="index.html">Nouvelle inscription</a></p>
  <div class="grid" id="liste"></div>
  <script>
    (async () => {
      const container = document.getElementById('liste');
      try {
        const res = await fetch('/liste-stagiaires.php');
        const data = await res.json();
        if (!Array.isArray(data)) throw new Error();
        container.replaceChildren(...data.map((s) => {
          const card = document.createElement('div');
          card.className = 'card';
          const img = document.createElement('img');
          img.src = s.photo;
          img.alt = `${s.prenom} ${s.nom}`;
          const name = document.createElement('strong');
          name.textContent = `${s.prenom} ${s.nom}`;
          const city = document.createElement('p');
          city.textContent = s.ville;
          card.append(img, name, city);
          return card;
        }));
      } catch {
        container.textContent = 'Impossible de charger la liste.';
      }
    })();
  </script>
</body>
</html>
