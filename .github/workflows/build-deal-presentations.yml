name: Build DEAL project PowerPoints

on:
  push:
    paths:
      - ".github/workflows/build-deal-presentations.yml"
      - "public/projects/deal-identite/presentation.html"
      - "public/projects/deal-planification/presentation.html"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  presentations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install presentation libraries
        run: python -m pip install python-pptx beautifulsoup4 pillow
      - name: Create downloadable PPTX files from the online presentations
        run: |
          python - <<'PY'
          from pathlib import Path
          from io import BytesIO
          from urllib.request import urlopen
          from bs4 import BeautifulSoup
          from pptx import Presentation
          from pptx.util import Inches, Pt
          from pptx.dml.color import RGBColor
          from pptx.enum.text import PP_ALIGN, MSO_ANCHOR
          from pptx.enum.shapes import MSO_SHAPE
          from PIL import Image
          
          NAVY = RGBColor(14, 22, 38)
          CARD = RGBColor(25, 40, 66)
          TEXT = RGBColor(237, 243, 255)
          PALE = RGBColor(161, 185, 220)
          BLUE = RGBColor(110, 168, 254)
          
          def textbox(slide, x, y, w, h, text, size=18, bold=False, color=TEXT):
              t = slide.shapes.add_textbox(Inches(x), Inches(y), Inches(w), Inches(h))
              tf=t.text_frame
              tf.word_wrap=True
              tf.margin_left=tf.margin_right=Inches(.04)
              tf.margin_top=tf.margin_bottom=Inches(.04)
              tf.text=text
              for p in tf.paragraphs:
                  p.font.name="Aptos"
                  p.font.size=Pt(size)
                  p.font.bold=bold
                  p.font.color.rgb=color
                  p.space_after=Pt(7)
              return t
          
          def fit_picture(slide, image, x, y, width, height):
              if image.startswith("https://"):
                  try:
                      with urlopen(image, timeout=12) as response:
                          data=response.read()
                      stream=BytesIO(data)
                  except Exception as err:
                      print("Skipping unavailable remote picture:", err)
                      return
              else:
                  path=Path("public")/image.lstrip("/")
                  if not path.exists():
                      print("Missing image:", path)
                      return
                  stream=BytesIO(path.read_bytes())
              try:
                  with Image.open(stream) as im:
                      iw, ih=im.size
                  stream.seek(0)
                  factor=min(width/iw,height/ih)
                  w,h=iw*factor,ih*factor
                  slide.shapes.add_picture(stream,Inches(x+(width-w)/2),Inches(y+(height-h)/2),width=Inches(w),height=Inches(h))
              except Exception as err:
                  print("Could not add picture:", err)
          
          def extracted_lines(section):
              lines=[]
              for element in section.find_all(["div", "p", "tr"]):
                  klass=element.get("class",[])
                  if element.name=="tr":
                      cells=[x.get_text(" ",strip=True) for x in element.find_all(["th","td"],recursive=False)]
                      if cells:
                          lines.append("  |  ".join(cells))
                  elif element.name=="div" and "box" in klass:
                      strong=element.find("strong")
                      p=element.find("p")
                      left=strong.get_text(" ",strip=True) if strong else ""
                      right=p.get_text(" ",strip=True) if p else ""
                      if left or right:
                          lines.append(left+(" — "+right if right else ""))
                  elif element.name=="div" and "quote" in klass:
                      lines.append(element.get_text(" ",strip=True))
                  elif element.name=="p":
                      if element.find_parent("div",class_="box") or element.find_parent("div",class_="quote"):
                          continue
                      if "note" in klass:
                          continue
                      t=element.get_text(" ",strip=True)
                      if t:
                          lines.append(t)
              return list(dict.fromkeys(lines))
          
          def build(html_path, out_path, eyebrow):
              html=BeautifulSoup(Path(html_path).read_text(encoding="utf-8"),"html.parser")
              sections=html.select("section.slide")
              assert len(sections)==6, (html_path,len(sections))
              deck=Presentation()
              deck.slide_width=Inches(13.333)
              deck.slide_height=Inches(7.5)
              for index,sec in enumerate(sections,1):
                  slide=deck.slides.add_slide(deck.slide_layouts[6])
                  slide.background.fill.solid()
                  slide.background.fill.fore_color.rgb=NAVY
                  slide.shapes.add_shape(MSO_SHAPE.ROUNDED_RECTANGLE, Inches(.58), Inches(.55), Inches(12.2), Inches(6.35))
                  shape=slide.shapes[-1]
                  shape.fill.solid()
                  shape.fill.fore_color.rgb=CARD
                  shape.line.fill.background()
                  textbox(slide,.94,.85,11,.30,eyebrow.upper()+"  ·  "+str(index)+"/6",12,True,BLUE)
                  heading=sec.find("h2")
                  title=heading.get_text(" ",strip=True) if heading else "DEAL"
                  textbox(slide,.94,1.36,11.5,.78,title,30,True,TEXT)
                  lines=extracted_lines(sec)
                  photo=sec.find("img")
                  if photo:
                      content_width=6.2
                      image_x,image_y,image_width,image_height=7.37,2.34,4.95,3.83
                      fit_picture(slide,photo.get("src",""),image_x,image_y,image_width,image_height)
                  else:
                      content_width=11.2
                  text="\n".join("•  "+line for line in lines[:11])
                  if text:
                      size=20 if len(text)<400 else 16 if len(text)<620 else 13
                      textbox(slide,.98,2.42,content_width,4.12,text,size,False,PALE)
                  textbox(slide,.96,6.68,10,.18,"DEAL  ·  Travail de groupe",10,False,PALE)
              out=Path(out_path)
              out.parent.mkdir(parents=True,exist_ok=True)
              deck.save(out)
              print(f"CREATED {out} ({out.stat().st_size} bytes; {len(deck.slides)} slides)")
          
          build("public/projects/deal-identite/presentation.html","public/docs/projets/Projet_1_Identite_visuelle_DEAL.pptx","Projet 1 — Identité visuelle")
          build("public/projects/deal-planification/presentation.html","public/docs/projets/Projet_2_Planification_DEAL.pptx","Projet 2 — Planification")
          
      - name: Commit presentations to public folder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/docs/projets/Projet_1_Identite_visuelle_DEAL.pptx public/docs/projets/Projet_2_Planification_DEAL.pptx
          if ! git diff --cached --quiet; then
            git commit -m "Add downloadable DEAL project PowerPoint presentations"
            git push
          fi
